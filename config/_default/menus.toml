# Navigation links
#   Top-level items link to sections of the home page (#anchor) or to pages.
#   Items with `parent` appear in a dropdown under that heading.
#   Talks, Posters and Peer review are commented out until those home sections are
#   switched on (active = true). Uncomment them at the same time.

