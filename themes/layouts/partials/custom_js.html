{{/* Small interaction enhancements: navbar shadow, back-to-top, hide menu links to inactive sections, section reveal. */}}
<a href="#" class="to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></a>
<script>
(function () {
  var nav = document.getElementById('navbar-main');
  var toTop = document.querySelector('.to-top');
  function onScroll() {
    var y = window.scrollY || window.pageYOffset;
    if (nav) nav.classList.toggle('is-scrolled', y > 10);
    if (toTop) toTop.classList.toggle('show', y > 600);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  if (toTop) toTop.addEventListener('click', function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // Hide list sections that have nothing in them yet (e.g. the blog before the first post is published).
  document.querySelectorAll('.home-section.wg-pages').forEach(function (sec) {
    var body = sec.querySelector('.col-lg-8');
    if (body && !body.textContent.trim()) sec.style.display = 'none';
  });

  // On the home page, hide menu links whose section is switched off (e.g. Talks before any talks are added).
  if (document.querySelector('.js-widget-page')) {
    document.querySelectorAll('#navbar-main a[href*="#"]').forEach(function (a) {
      var hash = a.hash;
      if (hash && hash.length > 1 && !document.getElementById(hash.slice(1))) {
        a.style.display = 'none';
      }
    });
  }

  // Fade sections in as they scroll into view.
  if ('IntersectionObserver' in window && window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
    document.documentElement.classList.add('js-reveal');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.home-section').forEach(function (s) { io.observe(s); });
  }
})();
</script>
